name: Reusable — Docker Build, Scan & Push

# Reusable workflow: build a Docker image, scan it with Trivy, and
# (optionally) push it to GitHub Container Registry (GHCR).
#
# Caller example:
#   jobs:
#     docker:
#       uses: ayesha9753/github-actions-reusable-workflows/.github/workflows/reusable-docker-build.yml@main
#       with:
#         image-name: my-app
#         push: true
#       secrets: inherit
#       permissions:
#         contents: read
#         packages: write   # required only when push: true

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image name (without registry), e.g. my-app"
        required: true
        type: string
      context:
        description: "Docker build context path"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile, relative to the context"
        required: false
        type: string
        default: "Dockerfile"
      push:
        description: "Push the image to GHCR after a successful scan"
        required: false
        type: boolean
        default: false
      registry:
        description: "Container registry to push to"
        required: false
        type: string
        default: "ghcr.io"
      tag:
        description: "Image tag (defaults to the short commit SHA)"
        required: false
        type: string
        default: ""
    secrets:
      # No registry secret is declared: GHCR uses the automatic GITHUB_TOKEN.
      # Callers pass `secrets: inherit` so future secret-based registries
      # can be added without changing the caller contract.
      inherit:
        required: false
    outputs:
      image-ref:
        description: "Full image reference that was built (registry/name:tag)"
        value: ${{ jobs.build.outputs.image-ref }}

jobs:
  build:
    name: Build, scan & push
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.meta.outputs.image-ref }}
    steps:
      - name: Check out the caller repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image reference
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA::7}"
          fi
          echo "image-ref=${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}:${TAG}"

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image-ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.meta.outputs.image-ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image
        if: inputs.push
        shell: bash
        run: docker push "${{ steps.meta.outputs.image-ref }}"
